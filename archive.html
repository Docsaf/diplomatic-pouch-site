<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Diplomatic Pouch — Archive. The complete catalog of dispatches by Dr. Safi Mojidi.">
<meta name="theme-color" content="#2E4732">
<title>Diplomatic Pouch — Archive</title>
<style>
:root {
  --bg: #F5F1E8;
  --bg-elev: #FAF7F0;
  --bg-card: #FFFFFF;
  --bg-chip: #ECE5D2;
  --ink: #1A2332;
  --ink-soft: #3A4254;
  --accent: #2E4732;
  --accent-soft: #4A6B4E;
  --gold: #8B6914;
  --muted: #5C6258;
  --rule: #C9C0AE;
  --rule-strong: #8B8472;
  --focus: #B8860B;
  --red: #8B2E2E;
  --amber: #B8860B;
  --serif: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
  --mono: ui-monospace, 'SF Mono', Monaco, 'Cascadia Mono', Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  [data-theme="auto"]:not([data-theme="light"]) {
    --bg: #1A2620; --bg-elev: #22302A; --bg-card: #26332C; --bg-chip: #243029;
    --ink: #F0EDE5; --ink-soft: #C8C5BD;
    --accent: #A8C5A8; --accent-soft: #7FA382;
    --gold: #D4A040; --muted: #8A9B8C;
    --rule: #3A4E40; --rule-strong: #5A7060; --focus: #D4A040;
    --red: #D47878; --amber: #D4A040;
  }
}
[data-theme="dark"] {
  --bg: #1A2620; --bg-elev: #22302A; --bg-card: #26332C; --bg-chip: #243029;
  --ink: #F0EDE5; --ink-soft: #C8C5BD;
  --accent: #A8C5A8; --accent-soft: #7FA382;
  --gold: #D4A040; --muted: #8A9B8C;
  --rule: #3A4E40; --rule-strong: #5A7060; --focus: #D4A040;
  --red: #D47878; --amber: #D4A040;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 1rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent); color: var(--bg); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 2px; }

/* === Masthead === */
.masthead {
  background: var(--bg-elev);
  border-bottom: 1px solid var(--rule);
  padding: 2.5rem 1.5rem 2rem;
  text-align: center;
}
@media (min-width: 48rem) { .masthead { padding: 3.5rem 3rem 2.5rem; } }
.masthead-inner { max-width: 48rem; margin: 0 auto; }
.masthead-eyebrow {
  font-family: var(--mono);
  font-size: 0.6875rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 1rem;
}
.masthead-title {
  font-family: var(--serif);
  font-size: clamp(2.5rem, 7vw, 4rem);
  font-weight: 600;
  font-style: italic;
  line-height: 0.95;
  letter-spacing: -0.02em;
  margin: 0 0 0.5rem;
  color: var(--accent);
}
.masthead-title em { font-style: italic; color: var(--ink); font-weight: 500; }
.masthead-sub {
  font-style: italic;
  color: var(--ink-soft);
  margin: 0.5rem 0 0;
  font-size: clamp(0.9375rem, 2vw, 1.0625rem);
}

/* === Controls bar === */
.controls {
  background: var(--bg);
  border-bottom: 1px solid var(--rule);
  padding: 1rem 1.5rem;
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.controls-inner {
  max-width: 72rem;
  margin: 0 auto;
  display: flex;
  gap: 1rem;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
}
.filter-group { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
.filter-label {
  font-family: var(--mono);
  font-size: 0.6875rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  margin-right: 0.25rem;
}
.filter-btn {
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.5rem 0.875rem;
  border: 1px solid var(--rule-strong);
  background: var(--bg-card);
  color: var(--ink);
  border-radius: 999px;
  cursor: pointer;
  transition: background 150ms, color 150ms, border-color 150ms;
  font-weight: 500;
}
.filter-btn:hover { background: var(--bg-chip); }
.filter-btn[aria-pressed="true"] {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}
.search-wrap { display: flex; align-items: center; gap: 0.5rem; }
.search-input {
  font-family: var(--sans);
  font-size: 0.875rem;
  padding: 0.5rem 0.875rem;
  border: 1px solid var(--rule-strong);
  background: var(--bg-card);
  color: var(--ink);
  border-radius: 999px;
  min-width: 10rem;
  max-width: 16rem;
}
.search-input:focus { outline: none; border-color: var(--accent); }

/* === Stats row === */
.stats {
  max-width: 72rem;
  margin: 0 auto;
  padding: 1.5rem 1.5rem 0.5rem;
  display: flex;
  gap: 2rem;
  flex-wrap: wrap;
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.stat strong { color: var(--ink); font-weight: 700; }
.stats-count { color: var(--accent); font-weight: 700; }

/* === Grid === */
.grid-wrap { max-width: 72rem; margin: 0 auto; padding: 1rem 1.5rem 4rem; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
  gap: 1.5rem;
}

/* === Card === */
.card {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: 6px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: transform 150ms, box-shadow 150ms, border-color 150ms;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(0,0,0,0.08);
  border-color: var(--rule-strong);
}
.card-cover {
  aspect-ratio: 1 / 1;
  background: var(--bg-chip);
  position: relative;
  overflow: hidden;
}
.card-cover img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.card-cover-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: repeating-linear-gradient(
    45deg,
    var(--bg-chip),
    var(--bg-chip) 10px,
    var(--bg-elev) 10px,
    var(--bg-elev) 20px
  );
  color: var(--muted);
  font-family: var(--mono);
  font-size: 0.6875rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  text-align: center;
  padding: 1rem;
}
.card-cover-placeholder-icon { font-size: 1.75rem; margin-bottom: 0.5rem; opacity: 0.5; }
.status-pip {
  position: absolute;
  top: 0.75rem;
  right: 0.75rem;
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  background: rgba(0, 0, 0, 0.75);
  color: #FFFFFF;
  font-family: var(--mono);
  font-size: 0.625rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.25rem 0.5rem;
  border-radius: 3px;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.status-pip::before {
  content: "";
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 50%;
  background: var(--pip-color, #999);
}
.status-pip.published { --pip-color: #4ADE80; }
.status-pip.draft { --pip-color: #FBBF24; }
.status-pip.scheduled { --pip-color: #60A5FA; }
.status-pip.pending-cover { --pip-color: #A78BFA; }

.card-body { padding: 1rem 1.125rem 1.25rem; display: flex; flex-direction: column; flex: 1; }
.card-meta {
  font-family: var(--mono);
  font-size: 0.6875rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-bottom: 0.5rem;
}
.card-meta .num { color: var(--gold); font-weight: 700; }
.card-meta .form { color: var(--accent); font-weight: 600; }
.card-meta .sep { opacity: 0.4; }
.card-title {
  font-family: var(--serif);
  font-size: 1.0625rem;
  font-weight: 600;
  line-height: 1.3;
  color: var(--ink);
  margin: 0 0 0.5rem;
}
.card-sub {
  font-family: var(--serif);
  font-style: italic;
  font-size: 0.875rem;
  line-height: 1.45;
  color: var(--ink-soft);
  margin: 0 0 0.75rem;
  flex: 1;
}
.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 0.5rem;
  border-top: 1px solid var(--rule);
  font-family: var(--mono);
  font-size: 0.6875rem;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.card-footer .read-link {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.card-footer .read-link:hover { color: var(--gold); }
.card-footer .read-link.disabled {
  color: var(--muted);
  cursor: not-allowed;
  pointer-events: none;
}

/* === Expanded card details on click === */
.card-details {
  display: none;
  padding: 0.75rem 0 0;
  margin-top: 0.75rem;
  border-top: 1px dashed var(--rule);
  font-family: var(--sans);
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--ink-soft);
}
.card.expanded .card-details { display: block; }
.card-details strong { color: var(--ink); font-weight: 600; }

/* === Empty state === */
.empty {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.9375rem;
}
.empty-emoji { font-size: 2rem; margin-bottom: 1rem; opacity: 0.6; }

/* === Footer === */
.site-footer {
  background: var(--bg-elev);
  border-top: 1px solid var(--rule);
  padding: 2rem 1.5rem;
  text-align: center;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.1em;
}
.site-footer a { color: var(--accent); text-decoration: none; }
.site-footer a:hover { color: var(--gold); }

/* === Theme toggle === */
.theme-toggle {
  position: fixed;
  bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
  right: 1.5rem;
  width: 2.75rem;
  height: 2.75rem;
  border-radius: 50%;
  background: var(--bg-card);
  border: 1px solid var(--rule-strong);
  color: var(--ink);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}
.theme-toggle:hover { background: var(--accent); color: var(--bg); }
.theme-toggle svg { width: 1.125rem; height: 1.125rem; stroke: currentColor; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; }
[data-theme="light"] .icon-sun, [data-theme="auto"] .icon-sun { display: none; }
[data-theme="dark"] .icon-moon { display: none; }
@media (prefers-color-scheme: dark) {
  [data-theme="auto"]:not([data-theme="light"]) .icon-moon { display: none; }
  [data-theme="auto"]:not([data-theme="light"]) .icon-sun { display: block; }
}

/* === Admin notice === */
.admin-notice {
  background: var(--bg-chip);
  border-left: 3px solid var(--gold);
  padding: 1rem 1.25rem;
  margin: 0 1.5rem 1.5rem;
  max-width: calc(72rem - 3rem);
  font-family: var(--sans);
  font-size: 0.8125rem;
  line-height: 1.55;
  color: var(--ink-soft);
  border-radius: 0 4px 4px 0;
}
@media (min-width: 48rem) { .admin-notice { margin: 0 auto 1.5rem; } }
.admin-notice summary {
  cursor: pointer;
  font-family: var(--mono);
  font-size: 0.6875rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 600;
  margin-bottom: 0.5rem;
}
.admin-notice summary:hover { color: var(--accent); }
.admin-notice code {
  font-family: var(--mono);
  font-size: 0.75rem;
  background: var(--bg);
  padding: 0.1rem 0.35rem;
  border-radius: 3px;
}
.admin-notice p { margin: 0.5rem 0; }
.admin-notice ul { margin: 0.5rem 0; padding-left: 1.25rem; }
.admin-notice li { margin-bottom: 0.35rem; }
</style>
</head>

    const card = document.createElement('article');
    card.className = 'card';
    card.setAttribute('role', 'listitem');
    card.setAttribute('data-form', d.form);
    card.setAttribute('data-status', d.status);
    card.setAttribute('data-title', d.title.toLowerCase());

    const cover = document.createElement('div');
    cover.className = 'card-cover';

    if (d.coverSrc) {
      const img = document.createElement('img');
      img.src = d.coverSrc;
      img.alt = 'Cover art for ' + d.title;
      img.loading = 'lazy';
      cover.appendChild(img);
    } else {
      const ph = document.createElement('div');
      ph.className = 'card-cover-placeholder';
      ph.innerHTML = '<div class="card-cover-placeholder-icon">◌</div>Cover<br>awaiting<br>design';
      cover.appendChild(ph);
    }

    const pip = document.createElement('span');
    pip.className = 'status-pip ' + d.status;
    pip.textContent = formatStatusLabel(d.status);
    cover.appendChild(pip);

    card.appendChild(cover);

    const body = document.createElement('div');
    body.className = 'card-body';

    const meta = document.createElement('div');
    meta.className = 'card-meta';
    const readingBit = d.readingMin > 0 ? ' <span class="sep">·</span> ~' + d.readingMin + ' min read' : '';
    meta.innerHTML = '<span class="num">No. ' + d.num + '</span><span class="sep">·</span><span class="form">' + d.form + '</span>' + readingBit;
    body.appendChild(meta);

    const title = document.createElement('h2');
    title.className = 'card-title';
    title.textContent = d.title;
    body.appendChild(title);

    const sub = document.createElement('p');
    sub.className = 'card-sub';
    sub.textContent = d.subtitle;
    body.appendChild(sub);

    const footer = document.createElement('div');
    footer.className = 'card-footer';
    const dateSpan = document.createElement('span');
    dateSpan.textContent = d.publishDateLabel;
    footer.appendChild(dateSpan);

    const link = document.createElement('a');
    link.className = 'read-link';
    if (d.url) {
      link.href = d.url;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = 'Read →';
    } else if (d.status === 'draft') {
      link.className = 'read-link disabled';
      link.href = '#';
      link.textContent = 'Draft';
    } else if (d.status === 'scheduled') {
      link.className = 'read-link disabled';
      link.href = '#';
      link.textContent = 'Scheduled';
    } else {
      link.className = 'read-link disabled';
      link.href = '#';
      link.textContent = '—';
    }
    footer.appendChild(link);
    body.appendChild(footer);

    if (d.notes) {
      const details = document.createElement('div');
      details.className = 'card-details';
      details.innerHTML = '<strong>Notes:</strong> ' + d.notes;
      body.appendChild(details);

      // Click anywhere on the card body (except the read link) to expand/collapse
      body.addEventListener('click', function(e) {
        if (e.target.tagName === 'A') return;
        card.classList.toggle('expanded');
      });
    }

    card.appendChild(body);
    return card;
  }

  function render() {
    grid.innerHTML = '';
    const q = state.search.trim().toLowerCase();

    const filtered = DISPATCHES.filter(function(d) {
      if (state.form !== 'all' && d.form !== state.form) return false;
      if (state.status !== 'all' && d.status !== state.status) return false;
      if (q && d.title.toLowerCase().indexOf(q) === -1 && d.subtitle.toLowerCase().indexOf(q) === -1) return false;
      return true;
    });

    if (filtered.length === 0) {
      empty.hidden = false;
    } else {
      empty.hidden = true;
      filtered.forEach(function(d) { grid.appendChild(makeCard(d)); });
    }

    renderStats(filtered);
  }

  function renderStats(filtered) {
    const total = DISPATCHES.length;
    const shown = filtered.length;
    const published = DISPATCHES.filter(function(d) { return d.status === 'published'; }).length;
    const drafts = DISPATCHES.filter(function(d) { return d.status === 'draft'; }).length;
    const scheduled = DISPATCHES.filter(function(d) { return d.status === 'scheduled'; }).length;

    stats.innerHTML =
      '<span class="stat">Showing <span class="stats-count">' + shown + '</span> of <strong>' + total + '</strong></span>' +
      '<span class="stat">● <strong>' + published + '</strong> published</span>' +
      '<span class="stat">◐ <strong>' + drafts + '</strong> draft</span>' +
      '<span class="stat">○ <strong>' + scheduled + '</strong> scheduled</span>';
  }

  // ============================================================
  // Filter wiring
  // ============================================================
  document.querySelectorAll('[data-filter-form]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      state.form = btn.getAttribute('data-filter-form');
      document.querySelectorAll('[data-filter-form]').forEach(function(b) {
        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
      });
      render();
    });
  });

  document.querySelectorAll('[data-filter-status]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      state.status = btn.getAttribute('data-filter-status');
      document.querySelectorAll('[data-filter-status]').forEach(function(b) {
        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
      });
      render();
    });
  });

  searchInput.addEventListener('input', function() {
    state.search = searchInput.value;
    render();
  });

  // ============================================================
  // Theme toggle (persisted in localStorage, if available)
  // ============================================================
  (function() {
    const root = document.documentElement;
    const toggle = document.getElementById('themeToggle');
    let stored = null;
    try { stored = localStorage.getItem('dp-archive-theme'); } catch(e) {}
    if (stored === 'light' || stored === 'dark') { root.setAttribute('data-theme', stored); }
    toggle.addEventListener('click', function() {
      const current = root.getAttribute('data-theme');
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const effective = current === 'auto' ? (systemDark ? 'dark' : 'light') : current;
      const next = effective === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('dp-archive-theme', next); } catch(e) {}
    });
  })();

  // Initial render
  render();
})();
</script>
</body>
</html>
